minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
default_language_version:
  python: python3.14
exclude: ^(\.hooks|bin)/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd)$
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=repo,docs,assets,bin,data,modules,tests,utils
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.8

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: no-replacement-char
        name: no U+FFFD replacement character
        entry: python .hooks/text_guard.py
        language: python
        types: [text]
      - id: no-secret-tokens
        name: no API tokens in tracked files
        entry: python .hooks/secret_tokens.py
        language: python
        types: [text]
      - id: no-ai-trailers
        name: no AI attribution in the commit message
        entry: python .hooks/ai_trailers.py
        language: python
        stages: [commit-msg]
      - id: no-mutating-assign
        name: no assignment that mutates its own target container
        entry: python .hooks/mutating_assign.py
        language: python
        types: [python]
